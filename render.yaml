services:
  - type: web
    name: geninfotech-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: geninfotech-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://geninfotech-site.onrender.com

  - type: web
    name: geninfotech-site
    runtime: static
    rootDir: frontend
    buildCommand: corepack yarn install --frozen-lockfile && corepack yarn build
    staticPublishPath: build
    autoDeploy: true
    envVars:
      - key: REACT_APP_BACKEND_URL
        value: https://geninfotech-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: geninfotech-db
    plan: free
    databaseName: gen_website
    user: gen_website_user
